<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Curiosity in. Useful software out.</title>
  <desc id="desc">An engineering loop: question, simplify, build, refine, then repeat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#19162f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71f6c2"/>
      <stop offset="1" stop-color="#b6a2ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#bg)" stroke="#303b53"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="40" y="61" font-size="32" font-weight="700" fill="#edf2ff">Curiosity in. <tspan fill="#71f6c2">Useful software out.</tspan></text>
    <text x="40" y="92" font-size="17" fill="#a6b3cc">A small loop for turning a question into something that works.</text>
  </g>
  <path d="M100 156H900" stroke="url(#flow)" stroke-width="2"/>
  <g fill="#101829" stroke-width="2">
    <circle cx="100" cy="156" r="23" stroke="#71f6c2"/>
    <circle cx="365" cy="156" r="23" stroke="#88dfd5"/>
    <circle cx="635" cy="156" r="23" stroke="#9fc1ea"/>
    <circle cx="900" cy="156" r="23" stroke="#b6a2ff"/>
  </g>
  <g font-family="Consolas,'Liberation Mono',monospace" font-size="16" text-anchor="middle" fill="#e2eafa">
    <text x="100" y="162">01</text>
    <text x="365" y="162">02</text>
    <text x="635" y="162">03</text>
    <text x="900" y="162">04</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#edf2ff">
    <text x="100" y="211">Question</text>
    <text x="365" y="211">Simplify</text>
    <text x="635" y="211">Build</text>
    <text x="900" y="211">Refine</text>
  </g>
  <path d="M900 232V258H100V240M94 247L100 240L106 247" fill="none" stroke="#6e7a9c" stroke-width="1.5"/>
  <rect x="449" y="246" width="102" height="24" rx="12" fill="#171a30"/>
  <text x="500" y="263" font-family="Consolas,'Liberation Mono',monospace" font-size="13" text-anchor="middle" letter-spacing="2" fill="#b6a2ff">REPEAT</text>
</svg>
